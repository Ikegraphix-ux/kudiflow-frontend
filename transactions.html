<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Transactions - KudiFlow</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="app-layout">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="brand">
            <h2>KudiFlow</h2>
            <span>Secure Digital Money</span>
        </div>

        <nav class="sidebar-nav">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="send-money.html">
                Send Money
            </a>

            <a href="transactions.html" class="active">
                Transactions
            </a>

        </nav>

        <button id="logoutBtn" class="logout-btn">
            Logout
        </button>

    </aside>


    <!-- Main Content -->
    <main class="main-content">

        <header class="page-header">

            <div>
                <h1>Transactions</h1>
                <p>View and manage your transaction history.</p>
            </div>

        </header>


        <!-- Filters -->
        <section class="transaction-filters">

            <div class="form-group">

                <label class="form-label">
                    Search
                </label>

                <input
                    type="text"
                    id="searchTransaction"
                    class="form-input"
                    placeholder="Search transaction..."
                >

            </div>


            <div class="form-group">

                <label class="form-label">
                    Status
                </label>

                <select id="statusFilter" class="form-input">

                    <option value="all">
                        All Transactions
                    </option>

                    <option value="success">
                        Successful
                    </option>

                    <option value="failed">
                        Failed
                    </option>

                    <option value="processing">
                        Processing
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label class="form-label">
                    Type
                </label>

                <select id="typeFilter" class="form-input">

                    <option value="all">
                        All Types
                    </option>

                    <option value="sent">
                        Money Sent
                    </option>

                    <option value="received">
                        Money Received
                    </option>

                </select>

            </div>

        </section>


        <!-- Transaction List -->
        <section class="card transaction-history">

            <div class="section-header">

                <div>
                    <h2>Transaction History</h2>
                    <p>Your recent financial activities</p>
                </div>

            </div>


            <div id="transactionList">

                <!-- Transactions generated by JavaScript -->

            </div>


            <!-- Empty State -->
            <div id="emptyState" class="empty-state hidden">

                <div class="empty-icon">
                    ↔
                </div>

                <h3>No transactions found</h3>

                <p>
                    Your transactions will appear here when you send
                    or receive money.
                </p>

                <a href="send-money.html" class="btn btn-primary">
                    Send Money
                </a>

            </div>

        </section>

    </main>

</div>


<script src="js/transactions.js"></script>
<script src="js/session.js"></script>
<script src="js/dashboard.js"></script>

</body>
</html>
