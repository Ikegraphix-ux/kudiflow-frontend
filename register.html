<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KudiFlow - Create Account</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="auth-page">
    <section class="auth-card card" aria-labelledby="register-title">
        <div class="auth-header">
            <div class="brand">
                <div class="brand-icon">K</div>
                <div>
                    <h1>KudiFlow</h1>
                    <p>Secure Digital Money Transfer</p>
                </div>
            </div>
            <h2 id="register-title">Create your account</h2>
            <p>Set up your KudiFlow account to get started.</p>
        </div>

        <div id="registerError" class="alert alert-error hidden" role="alert"></div>
        <div id="registerSuccess" class="alert alert-success hidden" role="status"></div>

        <form id="registerForm" novalidate>
            <div class="form-group">
                <label class="form-label" for="fullName">Full name</label>
                <input class="form-input" type="text" id="fullName" autocomplete="name" placeholder="Enter your full name" required>
                <small id="fullNameError" class="field-error hidden"></small>
            </div>

            <div class="form-group">
                <label class="form-label" for="email">Email address</label>
                <input class="form-input" type="email" id="email" autocomplete="email" placeholder="you@example.com" required>
                <small id="emailError" class="field-error hidden"></small>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <div class="password-wrapper">
                    <input class="form-input" type="password" id="password" autocomplete="new-password" placeholder="Create a password" required>
                    <button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password">Show</button>
                </div>
                <small id="passwordError" class="field-error hidden"></small>
            </div>

            <div class="form-group">
                <label class="form-label" for="confirmPassword">Confirm password</label>
                <div class="password-wrapper">
                    <input class="form-input" type="password" id="confirmPassword" autocomplete="new-password" placeholder="Re-enter your password" required>
                    <button type="button" class="password-toggle" id="confirmPasswordToggle" aria-label="Show password">Show</button>
                </div>
                <small id="confirmPasswordError" class="field-error hidden"></small>
            </div>

            <div class="form-group">
                <label>
                    <input type="checkbox" id="terms" required>
                    I agree to the KudiFlow terms and conditions.
                </label>
                <small id="termsError" class="field-error hidden"></small>
            </div>

            <button type="submit" class="btn btn-primary auth-submit" id="registerButton">
                <span id="registerButtonText">Create Account</span>
                <span id="registerSpinner" class="spinner hidden" aria-hidden="true"></span>
            </button>
        </form>

        <p class="auth-footer">Already have an account? <a href="index.html">Sign in</a></p>
    </section>
</main>

<script>
const form = document.getElementById('registerForm');
const button = document.getElementById('registerButton');
const buttonText = document.getElementById('registerButtonText');
const spinner = document.getElementById('registerSpinner');
const errorBox = document.getElementById('registerError');
const successBox = document.getElementById('registerSuccess');

function togglePassword(inputId, toggleId) {
    const input = document.getElementById(inputId);
    const toggle = document.getElementById(toggleId);
    toggle.addEventListener('click', () => {
        const visible = input.type === 'text';
        input.type = visible ? 'password' : 'text';
        toggle.textContent = visible ? 'Show' : 'Hide';
        toggle.setAttribute('aria-label', visible ? 'Show password' : 'Hide password');
    });
}

togglePassword('password', 'passwordToggle');
togglePassword('confirmPassword', 'confirmPasswordToggle');

function showFieldError(id, message) {
    const element = document.getElementById(id);
    element.textContent = message;
    element.classList.toggle('hidden', !message);
}

function clearErrors() {
    ['fullNameError', 'emailError', 'passwordError', 'confirmPasswordError', 'termsError']
        .forEach(id => showFieldError(id, ''));
    errorBox.classList.add('hidden');
    successBox.classList.add('hidden');
}

form.addEventListener('submit', event => {
    event.preventDefault();
    clearErrors();

    const fullName = document.getElementById('fullName').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const terms = document.getElementById('terms').checked;
    let valid = true;

    if (fullName.length < 2) {
        showFieldError('fullNameError', 'Please enter your full name.');
        valid = false;
    }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showFieldError('emailError', 'Please enter a valid email address.');
        valid = false;
    }
    if (password.length < 8) {
        showFieldError('passwordError', 'Password must be at least 8 characters.');
        valid = false;
    }
    if (password !== confirmPassword) {
        showFieldError('confirmPasswordError', 'Passwords do not match.');
        valid = false;
    }
    if (!terms) {
        showFieldError('termsError', 'Please accept the terms to continue.');
        valid = false;
    }

    if (!valid) return;

    button.disabled = true;
    buttonText.textContent = 'Creating Account...';
    spinner.classList.remove('hidden');

    setTimeout(() => {
        button.disabled = false;
        buttonText.textContent = 'Create Account';
        spinner.classList.add('hidden');
        successBox.textContent = 'Account created successfully for this demo. Redirecting to sign in...';
        successBox.classList.remove('hidden');
        setTimeout(() => { window.location.href = 'index.html'; }, 1200);
    }, 1200);
});
</script>
</body>
</html>
