<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KudiFlow - Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="auth-page">

        <section class="auth-card card">

            <div class="auth-header">

                <div class="brand">
                    <div class="brand-icon">K</div>

                    <div>
                        <h1>KudiFlow</h1>
                        <p>Secure Digital Money Transfer</p>
                    </div>
                </div>

                <h2>Welcome back</h2>

                <p>
                    Login to access your financial dashboard.
                </p>

            </div>

            <!-- Error message -->
            <div id="loginError" class="alert alert-error hidden">
                Invalid email or password.
            </div>

            <form id="loginForm">

                <div class="form-group">

                    <label class="form-label" for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        class="form-input"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >

                    <small id="emailError" class="field-error"></small>

                </div>

                <div class="form-group">

                    <label class="form-label" for="password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            class="form-input"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                        >
                            Show
                        </button>

                    </div>

                    <small id="passwordError" class="field-error"></small>

                </div>

                <button
                    type="submit"
                    id="loginButton"
                    class="btn btn-primary auth-submit"
                >
                    <span id="loginButtonText">Login</span>
                    <span id="loginSpinner" class="spinner hidden"></span>
                </button>

            </form>

            <p class="auth-footer">
                Don't have an account?
                <a href="register.html">Create an account</a>
            </p>

        </section>

    </main>

    <script src="js/auth.js"></script>

</body>

</html>
